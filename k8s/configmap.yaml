apiVersion: v1
kind: ConfigMap
metadata:
  name: training-config
  namespace: ml-training
data:
  training_config.yaml: |
    model:
      architecture: simple_cnn
      num_classes: 10

    training:
      epochs: 20
      batch_size: 64
      learning_rate: 0.001
      early_stopping_patience: 6
      min_delta: 0.001
      num_workers: 2
      seed: 42

    data:
      dataset: cifar10
      data_dir: /app/data

    output:
      checkpoint_dir: /app/checkpoints
      model_name: classifier_v1.pt
