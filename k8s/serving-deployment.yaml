apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-serving
  namespace: ml-training
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: model-serving

  template:
    metadata:
      labels:
        app: model-serving
    spec:
      securityContext:
        fsGroup: 10001

      containers:
        - name: model-api
          image: YOUR_DOCKERHUB_USERNAME/mlops-serve:v1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: MODEL_PATH
              value: /app/checkpoints/classifier_v1.pt

          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: model-checkpoints
              mountPath: /app/checkpoints
              readOnly: true

      volumes:
        - name: model-checkpoints
          persistentVolumeClaim:
            claimName: model-checkpoints-pvc
            readOnly: true
